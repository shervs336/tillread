name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  library:
    name: Library (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w tillread
      - run: npm run coverage -w tillread
      - run: npm test -w tillread -- -t "is fast"
      - run: npm run build -w tillread
      - name: Size budget
        run: npm run size -w tillread
      - name: Package exports (publint + are-the-types-wrong)
        run: npm run lint:pkg -w tillread

  site:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
